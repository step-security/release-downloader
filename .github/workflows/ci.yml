name: 'Build and Test'

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    if: >-
      ${{
        github.ref != 'refs/heads/main' ||
        github.actor != 'github-actions[bot]' ||
        !contains(github.event.head_commit.message, '[skip ci]')
      }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node and cache dependencies
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Validate source
        shell: bash
        run: |
          npm ci
          npm run verify

      - name: Download release asset by tag
        uses: ./
        id: download-by-tag
        with:
          repository: 'step-security/release-downloader'
          tag: 'v1.12.0'
          fileName: 'provenance.json'
          tarBall: true
          zipBall: true
          token: ${{ github.token }}
          out-file-path: './test-downloads'

      - name: List downloaded files
        shell: bash
        run: ls -lrth test-downloads

      - name: Download tarball and zipball only
        uses: ./
        with:
          repository: 'step-security/release-downloader'
          tag: 'v1.12.0'
          tarBall: true
          zipBall: true
          token: ${{ github.token }}
          out-file-path: './public-download'

      - name: List downloaded archive files
        shell: bash
        run: ls -lrth public-download

      - name: Download latest release
        uses: ./
        id: download-latest
        with:
          repository: 'step-security/release-downloader'
          latest: true
          fileName: 'provenance.json'
          tarBall: true
          zipBall: true
          token: ${{ github.token }}
          out-file-path: './latest-downloads'

      - name: List latest release downloads
        shell: bash
        run: ls -lrth latest-downloads

      - name: Read output variables set by previous steps
        shell: bash
        run: |
          if [ -n "${{ steps.download-by-tag.outputs.tag_name }}" ]; then
            echo "${{ steps.download-by-tag.outputs.tag_name }}"
          else
            echo "Unable to read output variable from step download-by-tag"
            exit 1
          fi

          if [ -n "${{ steps.download-latest.outputs.tag_name }}" ]; then
            echo "${{ steps.download-latest.outputs.tag_name }}"
          else
            echo "Unable to read output variable from step download-latest"
            exit 1
          fi

          echo "Downloaded files by tag:"
          echo '${{ steps.download-by-tag.outputs.downloaded_files }}'
          echo "Downloaded latest files:"
          echo '${{ steps.download-latest.outputs.downloaded_files }}'
